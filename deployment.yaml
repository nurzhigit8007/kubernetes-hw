apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-hw
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-hw
  template:
    metadata:
      labels:
        app: kubernetes-hw
    spec:
      containers:
        - name: kubernetes-hw
          image: nurzhigit09/kubernetes-hw:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "1.0.0"
